name: cherry-pick-commits

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "comma-separated commit SHAs to cherry-pick in order (tries origin, then stable/google mirrors, depth 2 cheap)"
        required: true
        default: ""
      ai_extra_prompt:
        description: "additional AI prompt for proper backport (e.g. 'adapt timer_delete_sync to del_timer_sync for 5.10, keep sync semantics')"
        required: false
        default: ""
      dry_run:
        description: "dry run without push"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cherry-pick-commits
  cancel-in-progress: false

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CloudFox-Kernel (fast)
        uses: actions/checkout@v5
        with:
          repository: CloudFox-INC/CloudFox-Kernel
          ref: android12-5.10-stable
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          filter: blob:none

      - name: Configure git
        run: |
          git config user.name "CloudFox-INC"
          git config user.email "CloudFox_INC@proton.me"
          git config commit.gpgsign false
          git config tag.gpgsign false
          git config rerere.enabled true

      - name: Cherry-pick commits (conflict -> AI resolve)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          set -o pipefail
          commits_raw="${{ inputs.commits }}"
          dry="${{ inputs.dry_run }}"
          echo "Commits: $commits_raw dry=$dry"
          # comma -> space, trim
          commits=$(echo "$commits_raw" | tr ',' ' ' | xargs -n1 | xargs)
          echo "Parsed: $commits"

          # ensure remotes for cheap fetch
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git 2>/dev/null || git remote set-url stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git 2>/dev/null || true
          git remote add stable-mirror https://github.com/gregkh/linux.git 2>/dev/null || git remote set-url stable-mirror https://github.com/gregkh/linux.git 2>/dev/null || true
          git remote add google https://android.googlesource.com/kernel/common 2>/dev/null || true
          git remote add xtensei https://github.com/XTENSEI/kernel_common_5.10.git 2>/dev/null || true

          sudo apt-get update -qq && sudo apt-get install -y jq 2>&1 | tail -n 5 || true

          for commit in $commits; do
            [ -z "$commit" ] && continue
            echo "===== Cherry-picking $commit ====="
            # cheap fetch commit + parent (depth 2)
            git fetch --depth=2 origin "$commit" 2>&1 | tail -n 5 || true
            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "Not on origin, trying upstreams depth 2..."
              git fetch --depth=2 stable "$commit" 2>&1 | tail -n 5 || true
              git fetch --depth=2 stable-mirror "$commit" 2>&1 | tail -n 5 || true
              git fetch --depth=2 google "$commit" 2>&1 | tail -n 5 || true
              git fetch --depth=2 xtensei "$commit" 2>&1 | tail -n 5 || true
            fi
            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "::error::cannot find commit $commit"
              exit 1
            fi
            echo "Target: $(git log --oneline -1 "$commit" | head)"
            # try cherry-pick
            if git cherry-pick --no-edit "$commit" 2>&1 | tee /tmp/cp.log; then
              echo "cherry-pick $commit ok"
              continue
            fi
            echo "Conflict on $commit, attempting AI resolve..."
            cat /tmp/cp.log | tail -n 30
            git status | head -n 50
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "::error::OPENROUTER_API_KEY not set - cannot auto-resolve cherry-pick conflict for $commit"
              git cherry-pick --abort 2>/dev/null || true
              exit 1
            fi
            for f in $(git diff --name-only --diff-filter=U); do
              echo "=== AI Resolving $f for $commit ==="
              if [ "$f" = "Makefile" ]; then
                echo "Makefile conflict - taking theirs to avoid LLM corruption"
                git checkout --theirs "$f" || true
                git add "$f"
                continue
              fi
              if file "$f" | grep -q "binary"; then
                git checkout --theirs "$f" || true
                git add "$f"
                continue
              fi
              content=$(cat "$f" 2>/dev/null || echo "")
              content_trunc=${content:0:120000}
              extra="${{ inputs.ai_extra_prompt }}"
              if [ -n "$extra" ]; then
                prompt="You are a kernel backport resolver. $extra Resolve git conflict markers <<<<<<< HEAD, =======, >>>>>>> in this file. Do a proper backport for the target tree (android12-5.10) - adapt APIs if needed (e.g. timer_delete_sync -> del_timer_sync, dmaengine_terminate_sync -> dmaengine_terminate_all with correct ordering), keep sync semantics and fix ordering, don't just take the incoming side verbatim because it fits. Remove markers, return ONLY file content, no markdown.\n\nFile: $f Commit: $commit\nContent:\n$content_trunc"
              else
                prompt="You are a kernel cherry-pick resolver. Resolve git conflict markers <<<<<<< HEAD, =======, >>>>>>> in this file. Prefer the incoming cherry-picked commit side for the changed hunk, but keep surrounding context. Remove markers, return ONLY file content, no markdown.\n\nFile: $f Commit: $commit\nContent:\n$content_trunc"
              fi
              resp=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                -H "Content-Type: application/json" \
                -H "HTTP-Referer: https://github.com/CloudFox-INC/CloudFox-Kernel-Builder" \
                -d @- <<EOF
          {
            "model": "minimax/minimax-m3:free",
            "models": ["openrouter/free"],
            "messages": [{"role": "system", "content": "You ONLY resolve git conflict markers. Return only file content, no markdown."}, {"role": "user", "content": $(jq -Rs . <<<"$prompt")}],
            "temperature": 0.1,
            "max_tokens": 120000
          }
          EOF
              )
              resolved=$(printf "%s" "$resp" | jq -r '.choices[0].message.content // empty' || true)
              if [ -z "$resolved" ] || echo "$resolved" | grep -q "^<<<<<<< "; then
                echo "LLM failed for $f, fallback to --theirs"
                git checkout --theirs "$f" || true
              else
                echo "$resolved" | sed -e 's/^```.*//g' -e 's/^```//g' > "$f.tmp"
                if [ $(wc -c < "$f.tmp") -gt 50 ]; then
                  mv "$f.tmp" "$f"
                else
                  rm -f "$f.tmp"
                fi
              fi
              if grep -q "^<<<<<<< " "$f"; then
                echo "Still markers, taking theirs"
                git checkout --theirs "$f" || true
              fi
              git add "$f"
              echo "Resolved $f"
            done
            if git cherry-pick --continue --no-edit 2>&1 | tee /tmp/cont.log; then
              echo "cherry-pick --continue ok for $commit"
            else
              echo "Failed to continue cherry-pick for $commit"
              cat /tmp/cont.log | tail -n 30
              git status | head -n 30
              exit 1
            fi
          done

          echo "All cherry-picks done:"
          git log --oneline -10 | head

          if [ "$dry" = "true" ]; then
            echo "dry_run, not pushing, resetting"
            # count how many we picked and reset
            n=$(echo "$commits" | wc -w)
            git reset --hard HEAD~$n 2>&1 | tail -n 5 || true
            exit 0
          fi

          # verify no markers
          if git ls-files --unmerged | grep -q .; then
            echo "::error::still unmerged"
            git ls-files --unmerged | head
            exit 1
          fi
          if grep -rn "^<<<<<<< " --include="*.c" --include="*.h" --include="Makefile" . 2>/dev/null > /tmp/markers.log; then
            echo "::error::still markers"
            cat /tmp/markers.log | head
            exit 1
          fi

          git push origin HEAD:android12-5.10-stable 2>&1 | tail -n 20
          echo "pushed $(git rev-parse --short HEAD) with $commits"

      - name: Summary
        if: always()
        run: |
          echo "Head: $(git rev-parse --short HEAD 2>&1 | head)"
          git log --oneline -5 | head
